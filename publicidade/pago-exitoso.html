<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento confirmado — ImpactoTV Mídia</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#020202"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/><style>
  :root {
    --bg:         #020202;
    --card:       #111111;
    --card2:      #1a1a1a;
    --accent:     #C9A244;
    --accent2:    #e8c96a;
    --accent-dim: rgba(201, 162, 68, 0.12);
    --red:        #ff5555;
    --text:       #ffffff;
    --text2:      #8a8a8a;
    --border:     rgba(201,162,68,0.15);
    --r:          16px;
    --r-sm:       10px;
    --font-title: 'Cinzel', serif;
    --font-body:  'Montserrat', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo-icon {
    width: 44px; height: 44px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .logo-text { font-family: var(--font-title); font-size: 18px; font-weight: 700; letter-spacing: .03em; color: var(--text); text-transform: uppercase; }
  .logo-text span { color: var(--accent); }
  .logo-sub  { font-size: 11px; color: var(--text2); margin-top: 2px; letter-spacing: .05em; text-transform: uppercase; }

  .loading, .error-box {
    text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px;
  }
  .error-box { color: #ff8888; line-height: 1.6; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .success-icon {
    width: 64px; height: 64px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    margin: 10px auto 18px;
  }
  .success-title { font-family: var(--font-title); text-align: center; font-size: 20px; font-weight: 700; letter-spacing: .01em; margin-bottom: 8px; text-transform: uppercase; }
  .success-sub   { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 26px; line-height: 1.6; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 22px;
    margin-bottom: 16px;
  }
  .card-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin-bottom: 12px; }

  .qr-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .qr-row img { border-radius: 8px; background: #fff; padding: 6px; flex-shrink: 0; }
  .token-box { flex: 1; min-width: 150px; }
  .token-val {
    font-size: 22px; font-weight: 800; letter-spacing: .08em;
    color: var(--accent); font-family: monospace; margin-bottom: 10px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #000; border: none; }
  .btn-wpp { background: #1ea952; color: #fff; border: none; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .btn-full { width: 100%; justify-content: center; margin-top: 6px; }

  .link-input {
    width: 100%; margin-top: 14px; font-size: 11px; font-family: monospace;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 11px; color: var(--text2);
  }

  .next-steps { font-size: 13px; color: var(--text2); line-height: 1.8; }
  .next-steps b { color: var(--text); }

  .footer-note { text-align: center; font-size: 11px; color: var(--text2); margin-top: 24px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row">
      <div class="logo-icon">🔺</div>
      <div>
        <div class="logo-text">Impacto<span>TV</span></div>
        <div class="logo-sub">Mídia · Publicidade DOOH</div>
      </div>
    </div>

    <div id="app">
      <div class="loading"><div class="spinner"></div>Confirmando seu pagamento...</div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://sdfwredxmyawvolxuifp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkZndyZWR4bXlhd3ZvbHh1aWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzQ2NzgsImV4cCI6MjA5NTIxMDY3OH0.rzVLfYDRQYk2v7qCVHcBZgJM2nTTKbMfbJ61EHm4HV4';
const LOCAL_KEY = 'lv_suscripcion_pendiente';
const COMPROBANTE_BASE_URL = 'comprobante.html';
const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/confirmar-suscripcion`;
const WHATSAPP_NUMERO = '554891981937'; // BR

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function confirmarPago() {
  const app = document.getElementById('app');
  let pendiente = null;

  try {
    pendiente = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
  } catch {}

  const params = new URLSearchParams(window.location.search);
  const preapprovalId = params.get('preapproval_id');

  if (!pendiente?.suscripcion_id || !preapprovalId) {
    // Sem assinatura identificada neste dispositivo, ou sem dado de verificação
    // do Mercado Pago na URL: não ativamos nada automaticamente.
    renderSinIdentificacion(app);
    return;
  }

  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({
        suscripcion_id: pendiente.suscripcion_id,
        preapproval_id: preapprovalId
      })
    });

    const data = await res.json();

    if (!res.ok || data?.error) {
      throw new Error(data?.error || 'Não foi possível confirmar o pagamento.');
    }

    localStorage.removeItem(LOCAL_KEY);
    renderExito(app, data);

  } catch (e) {
    app.innerHTML = `<div class="error-box">⚠️ Não foi possível confirmar automaticamente: ${esc(e.message)}<br><br>
      Não se preocupe — se o pagamento foi concluído no Mercado Pago, vamos ativar manualmente em poucas horas.</div>`;
  }
}

function renderExito(app, data) {
  const cliente = data.cliente;
  const plan = data.plan;
  const url = `${COMPROBANTE_BASE_URL}?t=${cliente.token_acceso}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(url)}`;
  const wppHtml = WHATSAPP_NUMERO
    ? `<a class="btn btn-wpp btn-full" target="_blank" href="https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent('Olá! Acabei de assinar o plano ' + plan.nombre + '. Meu nome é ' + cliente.nombre)}">💬 Falar no WhatsApp agora</a>`
    : '';

  app.innerHTML = `
    <div class="success-icon">✅</div>
    <div class="success-title">Pagamento confirmado!</div>
    <div class="success-sub">Obrigado, ${esc(cliente.nombre)}. Sua assinatura do plano <b>${esc(plan.nombre)}</b> está ativa.</div>

    <div class="card">
      <div class="card-label">📲 Seu acesso ao comprovante de veiculação</div>
      <div class="qr-row">
        <img src="${qrUrl}" alt="QR código de acesso" width="110" height="110">
        <div class="token-box">
          <div class="token-val">${esc(cliente.token_acceso)}</div>
          <div class="btn-row">
            <button class="btn" onclick="navigator.clipboard.writeText('${esc(url)}');this.textContent='Copiado ✓'">📋 Copiar link</button>
          </div>
        </div>
      </div>
      <input class="link-input" readonly value="${esc(url)}" onclick="this.select()">
    </div>

    <div class="card">
      <div class="card-label">📋 Próximos passos</div>
      <div class="next-steps">
        1. Nossa equipe vai entrar em contato para receber a <b>arte do seu anúncio</b> (logo, imagens ou vídeo).<br>
        2. Em até 5 dias úteis seu anúncio entra no ar nas telas do plano contratado.<br>
        3. Use o link acima para acompanhar quantas vezes seu anúncio foi exibido, a qualquer momento.
      </div>
      ${wppHtml}
    </div>

    <div class="footer-note">Guarde este link — ele é o seu acesso permanente ao comprovante de veiculação.</div>
  `;
}

function renderSinIdentificacion(app) {
  app.innerHTML = `
    <div class="success-icon">✅</div>
    <div class="success-title">Pagamento recebido</div>
    <div class="success-sub">
      Não conseguimos identificar automaticamente sua assinatura neste dispositivo
      (isso pode acontecer se você pagou em outro navegador ou app).
    </div>
    <div class="card">
      <div class="card-label">⚠️ O que fazer agora</div>
      <div class="next-steps">
        Não se preocupe, seu pagamento não se perdeu. Entre em contato pelo WhatsApp informando
        seu <b>nome completo</b> e o <b>plano escolhido</b> para que possamos ativar sua assinatura manualmente.
      </div>
      ${WHATSAPP_NUMERO ? `<a class="btn btn-wpp btn-full" target="_blank" href="https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent('Olá! Acabei de pagar minha assinatura e preciso confirmar a ativação.')}">💬 Falar no WhatsApp</a>` : ''}
    </div>
  `;
}

confirmarPago();
</script>
</body>
</html>
